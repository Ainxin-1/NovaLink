name: node-pipeline

# NovaLink Node Pipeline 定时更新（任务书第三十一章：主通道 GitHub 自动发布）
# 发布产物（data/published/ 与 data/pool.json）提交回仓库后，
# 可通过 jsDelivr 镜像访问：cdn.jsdelivr.net/gh/<owner>/<repo>@main/data/published/<file>

on:
  schedule:
    - cron: "0 */2 * * *"   # 每 2 小时一次（免费节点时效性强）
  workflow_dispatch: {}      # 支持手动触发

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 首跑需全量深检（云端源可达 1.5 万节点，TCP 快筛后进入深检的约 1.5 万个，
    # 单批 64 个约 1 分钟，全量约 50-70 分钟），故预留 90 分钟。
    # 注意：novanode fetch 内部已包含「抓取→解析→去重→检测→发布」全流程，
    # 不要再单独调用 novanode check（那会强制全量复检，把耗时翻倍导致超时）。
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: 构建 novanode
        working-directory: node
        run: go build -o ../novanode .

      - name: 下载 sing-box（深度检测用）
        run: |
          curl -sL -o sb.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.14.0/sing-box-1.14.0-linux-amd64.tar.gz
          tar xzf sb.tar.gz
          mv sing-box-1.14.0-linux-amd64/sing-box ./sing-box
          chmod +x ./sing-box

      - name: 运行节点管线（获取→解析→去重→协议级深度检测→发布）
        env:
          SINGBOX: ${{ github.workspace }}/sing-box
        run: |
          # 先把 CI 专用的核心路径写入配置，再一次性跑完整管线。
          python3 - <<'EOF'
          import json,pathlib
          p=pathlib.Path("data/pipeline.json")
          c=json.loads(p.read_text()) if p.exists() else {}
          c["singbox_path"]="./sing-box"
          c.setdefault("deep", True)
          c.setdefault("chunk_size", 64)
          c.setdefault("base_port", 30000)
          c.setdefault("max_latency_ms", 800)
          c.setdefault("max_deep", 6000)
          p.write_text(json.dumps(c,indent=2))
          EOF
          # fetch 一条命令即完成全流程（含检测与发布），无需再跑 check。
          ./novanode fetch -dir data
          # 清掉从未成功过的僵尸节点，避免池子无限膨胀（实测单轮可清 1.8 万个）。
          ./novanode prune -dir data
          ./novanode status -dir data

      - name: 提交发布产物
        run: |
          git config user.name "nova-pipeline-bot"
          git config user.email "nova-pipeline-bot@users.noreply.github.com"
          git add data/pool.json data/pipeline.json data/published/ data/sources.json
          git diff --cached --quiet && echo "无变化" || git commit -m "节点池更新 $(date -u '+%F %T')"
          git push
